name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: helios
          POSTGRES_PASSWORD: helios
          POSTGRES_DB: helios
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U helios -d helios"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HELIOS_DATABASE_URL: postgres://helios:helios@localhost:5432/helios?sslmode=disable
      HELIOS_REQUIRE_DB: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Tests
        run: mvn -q test
